name: Weekly sync

# Single automation entry point for the whole pipeline (CAP-1-3): detect, select
# the newest unseen video, queue the rest as metadata-only pending, fetch and
# Gemini-summarize the selected one, validate every summary, run the unit tests,
# then regenerate README/topics/knowledge-gpt from published videos and commit an explicit allowlist, rebase onto the branch head and push.
# Logic lives in scripts/weekly_sync.py (see docs/weekly-sync.md). Phases share a
# JSON report in $RUNNER_TEMP; the report, never log text, carries state.

on:
  schedule:
    # 03:00 UTC every Sunday, after the doctor's usual Saturday upload.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize writers per branch; never cancel a run that may be mid-write.
concurrency:
  group: weekly-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, yt-home]
    steps:
      - name: Set report path
        run: echo "REPORT=$RUNNER_TEMP/weekly-sync-report.json" >> "$GITHUB_ENV"

      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same verified, pinned scanner as the local command; finalize blocks on any
      # finding or scanner failure (scripts/scan_secrets.py, docs/security.md).
      - name: Verify pinned secret scanner
        run: python scripts/scan_secrets.py bootstrap

      - name: Detect, select, queue and fetch
        id: prepare
        run: python scripts/weekly_sync.py prepare --report "$REPORT"

      # The only step that receives the Gemini key.
      - name: Summarize selected video
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/weekly_sync.py summarize --report "$REPORT"

      # Runs after earlier failures so safe progress can still be committed, but
      # never after a cancellation; its exit status (1 red, 2 blocked) is the
      # job's final status.
      - name: Validate, test, commit and push
        if: ${{ !cancelled() }}
        run: python scripts/weekly_sync.py finalize --report "$REPORT"

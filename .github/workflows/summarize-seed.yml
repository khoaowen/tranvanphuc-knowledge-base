name: Summarize seed video

# Manual-only live run of scripts/summarize.py on the seed video, to measure
# Gemini free-tier limits (see docs/summarizer-limits.md). Entry 11 later
# absorbs this into weekly-sync.yml.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SEED_DIR: videos/2025-12-06-nhung-meo-chon-thuc-pham-bo-sung-omega-3-hieu-qua

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Summarize seed video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        shell: bash
        run: python scripts/summarize.py "$SEED_DIR" 2>&1 | tee measurement.log

      # Nothing is uploaded unless this scan of exactly the files to upload succeeds.
      # It holds no secrets; a finding, missing scanner or scan error fails the step.
      - name: Scan outputs for secrets
        id: scan
        if: always()
        shell: bash
        run: python scripts/scan_secrets.py artifacts "$SEED_DIR/summary.md" measurement.log

      - name: Upload summary and measurement log
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-summary
          path: |
            ${{ env.SEED_DIR }}/summary.md
            measurement.log
          if-no-files-found: warn

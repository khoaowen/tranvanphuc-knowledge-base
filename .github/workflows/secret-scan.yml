name: Secret scan

# Hosted, read-only check of the tracked snapshot and reachable history using the
# same pinned, checksum-verified Gitleaks gate as the local pipeline
# (scripts/scan_secrets.py, docs/security.md). No secrets, no self-hosted runner,
# no pull_request_target/workflow_run. Fork PRs run with a read-only token.
#
# Changes to the gate itself (this file, scripts/scan_secrets.py) are
# security-sensitive: a PR run executes the PR's own copy, so it cannot prove
# itself. Require owner review of those paths; see docs/security.md.

on:
  pull_request:
  push:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify pinned secret scanner
        run: python scripts/scan_secrets.py bootstrap

      - name: Scan snapshot and reachable history
        run: python scripts/scan_secrets.py repository

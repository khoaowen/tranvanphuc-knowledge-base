# tickets.toml for epic-video-knowledge-pipeline — build order is table order.
# Seed/test video used across verify steps and the closing suite: q7uDJG8YQ5c
# (https://www.youtube.com/watch?v=q7uDJG8YQ5c)

[[entry]]
id = 1
type = "story"
title = "Detect new videos + weekly workflow scaffold"
description = "detect_new_videos.py lists channel UC79E6KatRfXbmdWVWGncsew's uploads, diffs against videos/ already in repo, and emits the new-video-id list that later steps consume; .github/workflows/weekly-sync.yml scaffold (cron after Saturday, Python setup) invokes it. Decides and records the video-source approach (YouTube Data API key vs yt-dlp/scraping)."
verify = "workflow_dispatch run against the real channel correctly reports already-known videos as processed and would queue q7uDJG8YQ5c as new if its folder is absent."
covers = ["CAP-1"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Fetch transcript and metadata"
description = "fetch_transcript.py consumes entry 1's new-video-id list; for each, pulls the Vietnamese YouTube transcript and metadata (title, publish date, video id, url, duration) and writes videos/<slug>/transcript.md + metadata.json per repo-structure.md's naming convention."
verify = "Run against q7uDJG8YQ5c; videos/<slug>/transcript.md and metadata.json exist, correctly named and structured."
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Generate structured summary"
description = "summarize.py reads entry 2's transcript.md, calls an LLM to produce summary.md (key points, topic tags from a controlled vocabulary seeded from the first processed videos, timestamps) with the disclaimer banner per disclaimer.md. Decides and records the LLM provider/API key secret."
verify = "Run against q7uDJG8YQ5c's transcript.md; summary.md exists, is materially shorter than the transcript, tagged, timestamped, and carries the disclaimer."
covers = ["CAP-3"]
after = [2]
hitl = true
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Repo organization and consolidation"
description = "Generates/updates README.md (index by date and topic, disclaimer banner) and topics/*.md from videos/ already on disk (CAP-4); consolidate.py rebuilds knowledge-gpt/*.md from all videos/ content, repacking/rebalancing to stay <=20 files and under OpenAI's per-file size ceiling as the corpus grows (CAP-5)."
verify = "With q7uDJG8YQ5c (and any other seeded videos) on disk, the README/topics reach it in two clicks or fewer, and knowledge-gpt/ stays within both caps."
covers = ["CAP-4", "CAP-5"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Custom GPT setup instructions"
description = "docs/custom-gpt-setup.md: step-by-step GPT Builder setup (create GPT, upload knowledge-gpt/*.md, system-prompt text restating the disclaimer per health-specific answer and translating on demand per disclaimer.md), and how to re-upload after a pipeline run."
verify = "Following the doc once in the GPT Builder against entry 4's knowledge-gpt/ output, the GPT answers a question about q7uDJG8YQ5c's content in a non-Vietnamese language, grounded, with the disclaimer shown."
covers = ["CAP-6"]
after = [4]
hitl = true
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scope fixed at start from stories 1-5's plans and any review findings deferred during the epic; no new scope."
verify = "No new or changed behavior versus stories 1-5's own verify checks; lint/tests (if any) still pass."
covers = []
after = [1, 2, 3, 4, 5]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "End-to-end test suite"
description = "Runs the whole pipeline (stories 1-5) against q7uDJG8YQ5c specifically and checks every item in the epic's Done when in one pass: detection recognizes it as new, videos/<slug>/ has correct transcript+metadata+summary, README/topics reach it in <=2 clicks, knowledge-gpt/ stays within caps; documents (does not auto-run) the GPT Builder check from story 5."
verify = "A single run/check against q7uDJG8YQ5c passes all five Done-when items without manual patching."

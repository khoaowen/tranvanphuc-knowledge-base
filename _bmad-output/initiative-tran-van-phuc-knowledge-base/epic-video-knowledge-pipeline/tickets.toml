[[entry]]
id = 8
type = "story"
title = "Gemini CI summarizer"
description = "summarize.py chunks a 3-4h Vietnamese transcript (seed q7uDJG8YQ5c, ~51k words), map-reduces with Gemini (secret GEMINI_API_KEY, var GEMINI_MODEL, Free tier), and atomically writes (temp file, then rename) a retrieval-layer summary.md: self-contained header (title, id, date, URL, tags), topic sections with timestamps and ?t= links, question-shaped lines, specific claims, a VI/EN/FR glossary, the disclaimer banner per disclaimer.md, and fidelity to the transcript with hedges kept. It measures free-tier rate and daily limits against the seed and backs off on 429; it defines the summary schema and prompt that entries 9 and 10 reuse, takes its client as an injectable function so the end-to-end suite can stub it, and loads topics/vocabulary.md into the prompt when that file exists (tags are free-form until then)."
verify = "Run against q7uDJG8YQ5c: summary.md is written atomically, materially shorter than the transcript, and has every required element; the measured limits and 429 backoff behavior are recorded; the user approves the sample summary of that same video (q7uDJG8YQ5c is the omega-3 video, folder 2025-12-06-nhung-meo-chon-thuc-pham-bo-sung-omega-3-hieu-qua)."
covers = ["CAP-3"]
after = [2]
hitl = true
risk = "high"
unknown = "Free-tier Gemini rate and daily limits against a ~51k-word Vietnamese transcript are unmeasured; the story measures them and sets chunk size and pacing from the result."
references = ["../spec-tran-van-phuc-kb/.memlog.md (2026-10-11 decisions: summary as retrieval layer)", "../spec-tran-van-phuc-kb/pipeline-architecture.md#amendment-2026-10-11-0-hybrid-supersedes-step-d-as-ci-only"]

[[entry]]
id = 9
type = "story"
title = "Local review-batch via claude -p"
description = "Owns the shared queue/state helper (derives pending/transcribed/summarized from files; entry 10 reuses it). ./review-batch loops over pending or transcribed videos that have no summary, newest first (fetching a missing transcript via fetch_transcript.py first), and calls `claude -p` (Sonnet or Haiku, short fixed prompt built from entry 8's schema) for each; it writes to a temp file then renames, commits as it goes, retries short 429s with backoff, and on a real usage limit stops cleanly and prints the reset time. Re-running resumes; the backlog uses the same queue with no special mode. Local only: the subscription login is never used in CI. The claude command is injectable for stubbing, and the prompt loads topics/vocabulary.md when it exists."
verify = "On two transcribed videos (the builder fetches a second id with fetch_transcript.py; only q7uDJG8YQ5c is on disk): a run produces summaries and commits; an interrupted run re-run resumes without redoing finished videos; a simulated short 429 retries and a simulated usage limit stops cleanly with the reset time printed."
covers = ["CAP-3"]
after = [8]
hitl = true
risk = "medium"
unknown = "How to tell a short 429 from a real usage limit in `claude -p` output, and where the reset time comes from; settle by observing real output."

[[entry]]
id = 12
type = "story"
title = "Claude fidelity review of summaries (publish gate)"
description = "./review-summaries runs `claude -p` (Sonnet by default) on each summarized video, giving it the transcript and summary.md, and checks the summary against the transcript only: claims with no support, hedges turned into absolutes, medical content the doctor did not say, wrong timestamps (fidelity rules in summary-contract.md). It writes videos/<slug>/review.md with a verdict (pass, flag, fail) and the quoted lines, and never edits summary.md. A video is publishable only with a pass verdict: entry 10's gate reads review.md, so a missing, flagged or failed review keeps the video unpublished. Reuses entry 9's queue/state helper, resume, commit-as-it-goes, backoff and usage-limit behavior, and an injectable claude command. Covers Gemini-written and claude-written summaries alike, including the seed q7uDJG8YQ5c. Local only: the subscription login is never used in CI. Long transcripts are reviewed in chunks."
verify = "On q7uDJG8YQ5c and the claude-written V-Qfwjo28Zg: a run writes review.md for each and commits. A fixture summary with an invented claim and a hardened hedge gets a flag or fail verdict. A re-run skips reviewed videos; a stubbed usage limit stops cleanly with the reset time."
covers = ["CAP-3"]
after = [8, 9]
hitl = true
risk = "medium"
unknown = "Whether to review per transcript chunk or the whole summary against the whole transcript, and where a flag becomes a fail; settle by trying both on the two real videos."

[[entry]]
id = 10
type = "story"
title = "CI validator and publish gate"
description = "validate_summaries.py runs deterministic checks only: schema, disclaimer, timestamps within the video duration from metadata.json, length versus the transcript, tags in the topic vocabulary. An invalid or missing summary is not published and stays queued. Video state is derived from files only (pending -> transcribed -> summarized -> published; published also requires a pass verdict in review.md from entry 12), reusing entry 9's queue/state helper and entry 8's schema. The vocabulary path is a parameter so the unknown-tag fixture works without the real file."
verify = "Fixtures for each failure (bad schema, no disclaimer, timestamp past duration, too long/short, unknown tag) are rejected and stay queued; the valid q7uDJG8YQ5c summary passes and its state reads published."
covers = ["CAP-3"]
after = [8, 9, 12]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Weekly workflow: detect, fetch, summarize, validate, commit"
description = "Extends the existing weekly-sync.yml (single workflow file): detect new videos, fetch transcripts and metadata (which also queues the backlog as transcribed), summarize the newly detected video with Gemini (entry 8), validate (entry 10), and commit only valid results; it validates every summary on the branch, including ones pushed locally by entry 9, and rebases before pushing to avoid clashing with local pushes; selection rule: CI fetches and Gemini-summarizes only the single newest video not yet in videos/; it does not fetch the backlog. Backlog ids are queued as pending and fetched locally by entry 9, which fetches a missing transcript before summarizing; they stay out of CI."
verify = "A workflow_dispatch run on the real channel detects, fetches and commits transcripts, Gemini-summarizes only the new video, commits it only if valid, and leaves invalid or backlog videos queued; no secret appears in logs and no subscription login is used."
covers = ["CAP-1", "CAP-2", "CAP-3"]
after = [1, 2, 8, 10]
hitl = true
risk = "medium"


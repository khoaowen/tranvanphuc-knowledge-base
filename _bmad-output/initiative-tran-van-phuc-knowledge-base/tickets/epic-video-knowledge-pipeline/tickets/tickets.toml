[[entry]]
id = 9
type = "story"
title = "Local review-batch via claude -p"
description = "Owns the shared queue/state helper (derives pending/transcribed/summarized from files; entry 10 reuses it). ./review-batch loops over pending or transcribed videos that have no summary, newest first (fetching a missing transcript via fetch_transcript.py first), and calls `claude -p` (Sonnet or Haiku, short fixed prompt built from entry 8's schema) for each; it writes to a temp file then renames, commits as it goes, retries short 429s with backoff, and on a real usage limit stops cleanly and prints the reset time. Re-running resumes; the backlog uses the same queue with no special mode. Local only: the subscription login is never used in CI. The claude command is injectable for stubbing, and the prompt loads topics/vocabulary.md when it exists."
verify = "On two transcribed videos (the builder fetches a second id with fetch_transcript.py; only q7uDJG8YQ5c is on disk): a run produces summaries and commits; an interrupted run re-run resumes without redoing finished videos; a simulated short 429 retries and a simulated usage limit stops cleanly with the reset time printed."
covers = ["CAP-3"]
after = [8]
hitl = true
risk = "medium"
unknown = "How to tell a short 429 from a real usage limit in `claude -p` output, and where the reset time comes from; settle by observing real output."

[[entry]]
id = 12
type = "story"
title = "Claude fidelity review of summaries (publish gate)"
description = "./review-summaries runs `claude -p` (Sonnet by default) on each summarized video. For long transcripts, it reviews bounded chunks at timestamped segment boundaries with overlap; checks every summary claim against relevant raw Vietnamese transcript evidence and then audits the full summary across transcript/chunk coverage to catch omissions and boundary errors. Every finding cites a verbatim Vietnamese transcript quote and its timestamp range; no words are attributed to the doctor unless the transcript identifies the doctor as speaker (fidelity rules in summary-contract.md). Verdicts: pass only when all claims are supported, attributed, timestamped, and preserve qualifications; flag for localized unresolved or minor fidelity concerns; fail for clear unsupported or materially misleading claims. Only pass permits publishing; flag and fail both block. It writes videos/<slug>/review.md bound to the reviewed summary content (for example by SHA-256) with the verdict and quoted lines, and never edits summary.md. A missing, flagged, failed, or stale review keeps the video unpublished; changing summary.md after a pass requires re-review before entry 10 can publish it. Reuses entry 9's queue/state helper, resume, commit-as-it-goes, backoff and usage-limit behavior, and an injectable claude command. Covers Gemini-written and claude-written summaries alike, including the seed q7uDJG8YQ5c. Local only: the subscription login is never used in CI."
verify = "On q7uDJG8YQ5c and the claude-written V-Qfwjo28Zg: a run writes review.md for each and commits. Fixtures prove a clean supported summary passes; a localized unresolved/minor concern is flagged; an invented claim, hardened hedge, wrong attribution/timestamp, or other material defect fails. Both flag and fail keep the video unpublished. Long-transcript checks cover claims early, mid, late, and across chunk boundaries, verify each against transcript evidence, and confirm full-summary coverage. A re-run skips only reviews still bound to the current summary; a test changes summary.md after a passing review and verifies it becomes unpublished until re-reviewed. A stubbed usage limit stops cleanly with the reset time."
covers = ["CAP-3"]
after = [8, 9]
hitl = true
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "CI validator and publish gate"
description = "validate_summaries.py is read-only for transcript.md and checks its content hash before and after validation; tests prove transcript bytes are unchanged. It checks schema, disclaimer, timestamps within the video duration from metadata.json, length versus the transcript, tags in the topic vocabulary, and that only a current, successfully generated summary is eligible for consolidation. A failed regeneration preserves the prior summary but marks it stale/ineligible until validation and review succeed; no stale summary is published. Video state is derived from files only (pending -> transcribed -> summarized -> published; published also requires a pass verdict in review.md from entry 12), reusing entry 9's queue/state helper and entry 8's schema. The vocabulary path is a parameter so the unknown-tag fixture works without the real file."
verify = "Fixtures for each failure (bad schema, no disclaimer, timestamp past duration, too long/short, unknown tag, stale summary, missing/pending review) are rejected and stay unpublished; validator leaves transcript bytes and the previous summary unchanged. A valid current summary with passing review.md passes and reads published."
covers = ["CAP-3"]
after = [8, 9, 12]
hitl = false
risk = "medium"

